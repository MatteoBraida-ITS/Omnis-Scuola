services:
  db:
    image: postgres:18
    container_name: OmnisScuola-db
    environment:
      POSTGRES_USER: omnisscuola
      POSTGRES_PASSWORD: Omnis2026
      POSTGRES_DB: omnisscuola
    ports:
      - "5432:5432"
    volumes:
      - omnisscuola-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: OmnisScuola-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@omnisscuola.it
      PGADMIN_DEFAULT_PASSWORD: Omnis2026
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  omnisscuola-data:
  pgadmin-data:
